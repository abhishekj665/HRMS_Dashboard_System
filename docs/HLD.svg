<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description">
  <title id="title">HRMS Dashboard System — High-Level Design</title>
  <desc id="description">Architecture view of the HRMS web clients, frontend, Express API, domain services, persistence, integrations, realtime channel, and CI pipeline.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#334155"/></marker>
    <marker id="greenArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#15803d"/></marker>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#0f172a}.title{font-size:34px;font-weight:750}.subtitle{font-size:16px;fill:#475569}.group{font-size:19px;font-weight:700}.heading{font-size:20px;font-weight:700}.body{font-size:15px;fill:#334155}.small{font-size:13px;fill:#475569}.panel{stroke-width:2.5}.card{fill:#fff;fill-opacity:.84;stroke-width:1.5}.line{fill:none;stroke:#334155;stroke-width:3;marker-end:url(#arrow);stroke-linecap:round;stroke-linejoin:round}.green{fill:none;stroke:#15803d;stroke-width:3;marker-end:url(#greenArrow);stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#fff"/>
  <text x="64" y="62" class="title">HRMS Dashboard System</text>
  <text x="64" y="92" class="subtitle">High-Level Design · application boundaries and primary request flows</text>

  <rect x="48" y="135" width="250" height="500" rx="22" fill="#eff6ff" stroke="#60a5fa" class="panel"/><text x="72" y="175" class="group">People and clients</text>
  <rect x="72" y="205" width="202" height="100" rx="15" fill="#dbeafe" stroke="#60a5fa" class="card"/><text x="173" y="245" text-anchor="middle" class="heading">Employees · Managers</text><text x="173" y="275" text-anchor="middle" class="body">Organization admins</text>
  <rect x="72" y="330" width="202" height="78" rx="15" fill="#fff" stroke="#93c5fd" class="card"/><text x="173" y="363" text-anchor="middle" class="body" font-weight="700">Public candidates</text><text x="173" y="387" text-anchor="middle" class="small">Career site and applications</text>
  <rect x="72" y="433" width="202" height="160" rx="15" fill="#fff" stroke="#93c5fd" class="card"/><text x="173" y="472" text-anchor="middle" class="body" font-weight="700">Browser clients</text><text x="173" y="505" text-anchor="middle" class="small">HTTPS with cookie session</text><text x="173" y="532" text-anchor="middle" class="small">Socket.IO connection</text><text x="173" y="559" text-anchor="middle" class="small">Dashboard and career pages</text>

  <rect x="340" y="135" width="300" height="500" rx="22" fill="#eff6ff" stroke="#3b82f6" class="panel"/><text x="364" y="175" class="group">Web application</text>
  <rect x="364" y="205" width="252" height="112" rx="15" fill="#dbeafe" stroke="#60a5fa" class="card"/><text x="490" y="246" text-anchor="middle" class="heading">React + Vite</text><text x="490" y="276" text-anchor="middle" class="body">React Router · Redux Toolkit</text><text x="490" y="299" text-anchor="middle" class="small">Role-protected routes</text>
  <rect x="364" y="344" width="252" height="112" rx="15" fill="#fff" stroke="#93c5fd" class="card"/><text x="490" y="383" text-anchor="middle" class="body" font-weight="700">Session and access</text><text x="490" y="412" text-anchor="middle" class="small">Cross-tab session validation</text><text x="490" y="436" text-anchor="middle" class="small">Role-aware dashboard routing</text>
  <rect x="364" y="483" width="252" height="120" rx="15" fill="#fff" stroke="#93c5fd" class="card"/><text x="490" y="522" text-anchor="middle" class="body" font-weight="700">Recruitment experience</text><text x="490" y="551" text-anchor="middle" class="small">Public careers and job details</text><text x="490" y="576" text-anchor="middle" class="small">Employee applications and referrals</text>

  <rect x="682" y="135" width="350" height="500" rx="22" fill="#fffbeb" stroke="#f59e0b" class="panel"/><text x="706" y="175" class="group">Express API</text>
  <rect x="706" y="205" width="302" height="90" rx="15" fill="#fef3c7" stroke="#fbbf24" class="card"/><text x="857" y="243" text-anchor="middle" class="body" font-weight="700">Ingress and request limits</text><text x="857" y="270" text-anchor="middle" class="small">CORS · proxy-aware client IP</text>
  <rect x="706" y="319" width="302" height="90" rx="15" fill="#fff" stroke="#fcd34d" class="card"/><text x="857" y="357" text-anchor="middle" class="body" font-weight="700">Authentication and validation</text><text x="857" y="384" text-anchor="middle" class="small">JWT cookie · roles · Joi · uploads</text>
  <rect x="706" y="433" width="302" height="80" rx="15" fill="#fff" stroke="#fcd34d" class="card"/><text x="857" y="468" text-anchor="middle" class="body" font-weight="700">Public and protected routes</text><text x="857" y="493" text-anchor="middle" class="small">Auth · HR · recruitment · careers</text>
  <rect x="706" y="537" width="302" height="66" rx="15" fill="#fff" stroke="#fcd34d" class="card"/><text x="857" y="577" text-anchor="middle" class="body" font-weight="700">Controllers · centralized errors</text>

  <rect x="1074" y="135" width="260" height="500" rx="22" fill="#f0fdf4" stroke="#22c55e" class="panel"/><text x="1098" y="175" class="group">Domain services</text>
  <rect x="1098" y="205" width="212" height="112" rx="15" fill="#dcfce7" stroke="#86efac" class="card"/><text x="1204" y="245" text-anchor="middle" class="body" font-weight="700">Business workflows</text><text x="1204" y="274" text-anchor="middle" class="small">Recruitment · HR · payments</text><text x="1204" y="298" text-anchor="middle" class="small">Profiles · subscriptions</text>
  <rect x="1098" y="344" width="212" height="112" rx="15" fill="#fff" stroke="#86efac" class="card"/><text x="1204" y="384" text-anchor="middle" class="body" font-weight="700">Recruitment</text><text x="1204" y="413" text-anchor="middle" class="small">Applications and referrals</text><text x="1204" y="437" text-anchor="middle" class="small">Job and tenant validation</text>
  <rect x="1098" y="483" width="212" height="120" rx="15" fill="#fff" stroke="#86efac" class="card"/><text x="1204" y="523" text-anchor="middle" class="body" font-weight="700">Tenant boundaries</text><text x="1204" y="552" text-anchor="middle" class="small">Organization-scoped queries</text><text x="1204" y="576" text-anchor="middle" class="small">requireTenantId · scoped filters</text>

  <rect x="1370" y="135" width="182" height="500" rx="22" fill="#f5f3ff" stroke="#8b5cf6" class="panel"/><text x="1394" y="175" class="group">Persistence</text>
  <rect x="1392" y="220" width="138" height="160" rx="15" fill="#ede9fe" stroke="#a78bfa" class="card"/><ellipse cx="1461" cy="259" rx="34" ry="12" fill="#ddd6fe" stroke="#6d28d9" stroke-width="3"/><path d="M1427 259v70c0 7 15 13 34 13s34-6 34-13v-70M1427 295c0 7 15 13 34 13s34-6 34-13" fill="none" stroke="#6d28d9" stroke-width="3"/><text x="1461" y="370" text-anchor="middle" class="body" font-weight="700">MySQL</text>
  <text x="1392" y="424" class="small">Sequelize ORM</text><text x="1392" y="454" class="small">Users and HR records</text><text x="1392" y="484" class="small">Recruitment</text><text x="1392" y="514" class="small">Subscriptions</text><text x="1392" y="544" class="small">Tenant-owned data</text>

  <path d="M298 380H330V260H352" class="line"/><path d="M640 260H672" class="line"/><path d="M1032 260H1064" class="line"/><path d="M1334 300H1360" class="line"/>
  <text x="304" y="352" class="small">HTTPS</text><text x="644" y="245" class="small">API</text><text x="1036" y="245" class="small">service calls</text>

  <rect x="340" y="700" width="520" height="210" rx="22" fill="#fff1f2" stroke="#fb7185" class="panel"/><text x="364" y="740" class="group">External integrations</text>
  <rect x="364" y="766" width="145" height="110" rx="14" fill="#ffe4e6" stroke="#fda4af" class="card"/><text x="436" y="809" text-anchor="middle" class="body" font-weight="700">Brevo</text><text x="436" y="839" text-anchor="middle" class="small">OTP · recruitment email</text><text x="436" y="860" text-anchor="middle" class="small">referral notices</text>
  <rect x="526" y="766" width="145" height="110" rx="14" fill="#fff" stroke="#fda4af" class="card"/><text x="598" y="809" text-anchor="middle" class="body" font-weight="700">Cloudinary</text><text x="598" y="839" text-anchor="middle" class="small">Resume and</text><text x="598" y="860" text-anchor="middle" class="small">document storage</text>
  <rect x="688" y="766" width="148" height="110" rx="14" fill="#fff" stroke="#fda4af" class="card"/><text x="762" y="809" text-anchor="middle" class="body" font-weight="700">Razorpay</text><text x="762" y="839" text-anchor="middle" class="small">Payments · orders</text><text x="762" y="860" text-anchor="middle" class="small">signed webhook</text>
  <path d="M1204 635V676H436V754" class="green"/><path d="M1218 635V668H598V754" class="green"/><path d="M1232 635V660H762V754" class="green"/>

  <rect x="900" y="700" width="270" height="210" rx="22" fill="#ecfeff" stroke="#06b6d4" class="panel"/><text x="924" y="740" class="group">Realtime channel</text><rect x="924" y="766" width="222" height="110" rx="14" fill="#cffafe" stroke="#67e8f9" class="card"/><text x="1035" y="808" text-anchor="middle" class="body" font-weight="700">Socket.IO</text><text x="1035" y="839" text-anchor="middle" class="small">JWT cookie validation</text><text x="1035" y="860" text-anchor="middle" class="small">Tenant-scoped event rooms</text>
  <path d="M490 635V676H1035V754" class="line"/><path d="M1250 635V686H1155V754" class="line"/>

  <rect x="1210" y="700" width="342" height="210" rx="22" fill="#f0f9ff" stroke="#38bdf8" class="panel"/><text x="1234" y="740" class="group">Continuous integration</text><rect x="1234" y="766" width="294" height="110" rx="14" fill="#e0f2fe" stroke="#7dd3fc" class="card"/><text x="1254" y="808" class="body" font-weight="700">GitHub Actions</text><text x="1254" y="839" class="small">Server Jest tests and coverage</text><text x="1254" y="860" class="small">Client production build</text>
  <path d="M860 812H886" class="line"/><path d="M1170 812H1196" class="line"/>
  <text x="64" y="965" class="small">Rate limits: standard API 300 requests/IP/15 min · authentication 12 requests/IP/15 min · in-memory store per API process.</text>
